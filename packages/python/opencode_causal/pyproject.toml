[project]
name = "opencode-causal"
version = "0.1.0"
description = "Causal inference MCP servers for OpenCode"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jupyter-client>=8.6.0",
    "ipykernel>=6.29.0",
    "mcp>=0.9.0",
    "networkx>=3.2",
    "pgmpy>=0.1.25",
    "pydot>=2.0.0",
    "langchain>=0.1.0",
    "faiss-cpu>=1.7.4",
    "sentence-transformers>=2.2.0",
    "anthropic>=0.18.0",
    "jupyter-collaboration>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
